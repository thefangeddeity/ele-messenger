[package]
name = "ele-client"
version = "0.1.0"
edition = "2024"
description = "ELE Messenger desktop client: the ELE Mesh, with or without a daemon on this machine"
license = "GPL-3.0-or-later"

[[bin]]
name = "ele"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", features = ["persistence"] }
elemesh = { path = "../mesh" }
mdns-sd = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4", features = ["json"] }
webbrowser = "1.2"
