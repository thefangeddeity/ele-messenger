# Shares this machine's ELE Mesh page with other devices as /elem/.
# The ele-messenger package installs it as
# /etc/nginx/snippets/ele-messenger-mesh.conf; include it in the server block
# that serves this machine's pages (the camera suite already includes
# snippets/ele-messenger*.conf). Send /elem itself to /elem/ there too.
# Visitors sign in with the mesh passphrase; this machine's own settings stay
# changeable only on the machine itself. elemesh keeps listening on loopback
# only; nginx is the one door in.
location /elem/ {
    proxy_pass http://127.0.0.1:8740/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Marks the request as coming through here, so elemesh asks for the
    # passphrase instead of treating it as this machine.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The page waits up to 25 s for new messages.
    proxy_read_timeout 60s;
    proxy_buffering off;
}
